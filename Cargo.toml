[package]
name = "piers"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["guest"]
resolver = "3"

[dependencies]
anyhow = "1.0.100"
fs-err = "3.1.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wasmtime = { version = "44.0.1", features = ["component-model"] }
wasmtime-wasi = "44.0.1"
